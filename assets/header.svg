<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b1020"/><stop offset="0.55" stop-color="#0f2a44"/><stop offset="1" stop-color="#1d1240"/>
  </linearGradient>
  <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#36bcf7"/><stop offset="0.5" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="8s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="txt2" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect" gradientUnits="objectBoundingBox">
    <stop offset="0" stop-color="#36bcf7"/><stop offset="0.5" stop-color="#c4b5fd"/><stop offset="1" stop-color="#36bcf7"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#36bcf7" stop-opacity="0.25"/><stop offset="1" stop-color="#36bcf7" stop-opacity="0"/></radialGradient>
</defs>
<style>
  .edge{stroke:#36bcf7;stroke-opacity:.12;stroke-width:1}
  .pulse{stroke:#7dd3fc;stroke-width:2;stroke-dasharray:14 400;stroke-dashoffset:414;stroke-linecap:round;animation:flow 3.2s linear infinite;opacity:.9}
  @keyframes flow{to{stroke-dashoffset:0}}
  .node{fill:#0b1020;stroke:#36bcf7;stroke-width:2.5;animation:beat 2.6s ease-in-out infinite}
  @keyframes beat{0%,100%{fill:#0b1020}50%{fill:#36bcf7}}
  .star{fill:#ffffff;opacity:.15;animation:tw 4s ease-in-out infinite}
  @keyframes tw{50%{opacity:.7}}
  .name{font:800 64px 'Segoe UI',Helvetica,Arial,sans-serif;fill:url(#txt);letter-spacing:1px;opacity:0;animation:up 1.2s ease-out .2s forwards}
  .sub{font:500 18px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#cbd5e1;letter-spacing:.5px;opacity:0;animation:up 1.2s ease-out .7s forwards}
  .chip{opacity:0;animation:up 1s ease-out 1.2s forwards}
  .chiptxt{font:600 14px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#e2e8f0}
  text,g{transform-box:fill-box}
  @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  .scan{animation:scan 6s ease-in-out infinite}
  @keyframes scan{0%,100%{transform:translateX(-420px)}50%{transform:translateX(420px)}}
</style>
