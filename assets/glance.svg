<svg xmlns="http://www.w3.org/2000/svg" width="520" height="400" viewBox="0 0 520 400">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#151a3a"/></linearGradient></defs>
<style>
 .t{font:700 20px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#e2e8f0}
 .num{font:800 30px 'Segoe UI',Helvetica,Arial,sans-serif}
 .lab{font:700 12px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#94a3b8;letter-spacing:1px}
 .k{font:700 14px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#94a3b8}
 .v{font:600 14px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#e2e8f0}
 .fade{opacity:0;animation:fi .9s ease-out forwards}
 @keyframes fi{to{opacity:1}}
 .dot{animation:bl 1.6s ease-in-out infinite}
 @keyframes bl{50%{opacity:.2}}
</style>
<rect x="1" y="1" width="518" height="398" rx="16" fill="url(#bg)" stroke="#36bcf7" stroke-opacity=".35"/>
<text x="28" y="48" class="t">At a glance</text>
<circle cx="410" cy="42" r="5" fill="#22c55e" class="dot"/><text x="422" y="47" class="k" style="fill:#22c55e">Available</text>
<line x1="28" y1="64" x2="492" y2="64" stroke="#334155"/>
<g class="fade" style="animation-delay:0.2s">
  <circle cx="95" cy="140" r="52" fill="none" stroke="#36bcf7" stroke-opacity=".15" stroke-width="9"/>
  <circle cx="95" cy="140" r="52" fill="none" stroke="#36bcf7" stroke-width="9" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="326.7" transform="rotate(-90 95 140)" style="animation:draw0 1.6s ease-out 0.4s forwards"/>
  <text x="95" y="152" text-anchor="middle" class="num" fill="#36bcf7">2+</text>
  <text x="95" y="222" text-anchor="middle" class="lab">YEARS</text>
  <text x="95" y="240" text-anchor="middle" class="lab">EXPERIENCE</text>
</g>
<style>@keyframes draw0{to{stroke-dashoffset:111.1}}</style><g class="fade" style="animation-delay:0.45s">
  <circle cx="260" cy="140" r="52" fill="none" stroke="#a78bfa" stroke-opacity=".15" stroke-width="9"/>
  <circle cx="260" cy="140" r="52" fill="none" stroke="#a78bfa" stroke-width="9" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="326.7" transform="rotate(-90 260 140)" style="animation:draw1 1.6s ease-out 0.65s forwards"/>
  <text x="260" y="152" text-anchor="middle" class="num" fill="#a78bfa">10+</text>
  <text x="260" y="222" text-anchor="middle" class="lab">PROJECTS</text>
  <text x="260" y="240" text-anchor="middle" class="lab">BUILT</text>
</g>
<style>@keyframes draw1{to{stroke-dashoffset:49.0}}</style><g class="fade" style="animation-delay:0.7s">
  <circle cx="425" cy="140" r="52" fill="none" stroke="#22d3ee" stroke-opacity=".15" stroke-width="9"/>
  <circle cx="425" cy="140" r="52" fill="none" stroke="#22d3ee" stroke-width="9" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="326.7" transform="rotate(-90 425 140)" style="animation:draw2 1.6s ease-out 0.9s forwards"/>
  <text x="425" y="152" text-anchor="middle" class="num" fill="#22d3ee">4+</text>
  <text x="425" y="222" text-anchor="middle" class="lab">CERTIFICATIONS</text>
  <text x="425" y="240" text-anchor="middle" class="lab">EARNED</text>
</g>
<style>@keyframes draw2{to{stroke-dashoffset:163.4}}</style>
<line x1="28" y1="262" x2="492" y2="262" stroke="#334155"/>
<g class="fade" style="animation-delay:1.2s"><circle cx="40" cy="285" r="5" fill="#36bcf7"/><text x="56" y="290" class="k">Education</text><text x="160" y="290" class="v">MS CS · Wichita State University</text></g><g class="fade" style="animation-delay:1.4s"><circle cx="40" cy="319" r="5" fill="#a78bfa"/><text x="56" y="324" class="k">Undergrad</text><text x="160" y="324" class="v">BE Computer Engineering · NMIT Bangalore</text></g><g class="fade" style="animation-delay:1.6s"><circle cx="40" cy="353" r="5" fill="#22d3ee"/><text x="56" y="358" class="k">Location</text><text x="160" y="358" class="v">Wichita, Kansas, USA</text></g>
</svg>